[project]
name = "trading-ai-lab"
version = "0.1.0"
description = "Local-first options research knowledge brain"
requires-python = ">=3.11"

dependencies = [
    # PDF extraction
    "pymupdf>=1.24.0",
    # Data modeling
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Vector database (local mode — no Docker required)
    "qdrant-client>=1.10.0",
    # Embeddings (local — no API key required)
    "sentence-transformers>=3.1.0",
    # Web API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    # Backtesting + quantitative analysis
    "ivolatility>=1.8.2",
    "pyarrow>=15.0",
    "arch>=6.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
openai-embeddings = [
    "openai>=1.35.0",
]
voyage-embeddings = [
    "voyageai>=0.2.3",
]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
